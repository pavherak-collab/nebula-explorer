<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Explorer</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="stars"></div>

<div class="container">

  <aside class="sidebar">

    <h1>NEBULA</h1>

    <button class="planet-btn active"
      data-name="Earth"
      data-distance="149.6 million km"
      data-fact="Earth is the only known planet to support life."
      data-image="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg">
      Earth
    </button>

    <button class="planet-btn"
      data-name="Mars"
      data-distance="227.9 million km"
      data-fact="Mars hosts the tallest volcano in the solar system."
      data-image="https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg">
      Mars
    </button>

    <button class="planet-btn"
      data-name="Jupiter"
      data-distance="778.5 million km"
      data-fact="Jupiter is larger than all other planets combined."
      data-image="https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg">
      Jupiter
    </button>

    <button class="planet-btn"
      data-name="Saturn"
      data-distance="1.4 billion km"
      data-fact="Saturn's rings are mostly ice and rock."
      data-image="https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg">
      Saturn
    </button>

  </aside>

  <main class="content">

    <div class="planet-wrapper">
      <img
        id="planetImage"
        src="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg"
        alt="Planet">
    </div>

    <div class="info">

      <span>PLANET PROFILE</span>

      <h2 id="planetName">Earth</h2>

      <p id="planetFact">
        Earth is the only known planet to support life.
      </p>

      <div class="stats">
        <div class="stat">
          <small>Distance from Sun</small>
          <strong id="planetDistance">
            149.6 million km
          </strong>
        </div>
      </div>

    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
